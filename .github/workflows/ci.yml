name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test:engine

  ios-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: pnpm install --frozen-lockfile=false
      - name: Check Expo package compatibility
        id: expo_doctor
        continue-on-error: true
        run: pnpm --filter @fitment/mobile doctor > expo-doctor.log 2>&1
      - name: Preserve Expo Doctor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-doctor-log
          path: expo-doctor.log
      - name: Report Expo Doctor failure
        if: steps.expo_doctor.outcome == 'failure'
        run: cat expo-doctor.log && exit 1
      - name: Typecheck mobile app
        id: mobile_typecheck
        continue-on-error: true
        run: pnpm --filter @fitment/mobile typecheck > mobile-typecheck.log 2>&1
      - name: Preserve mobile typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-typecheck-log
          path: mobile-typecheck.log
      - name: Report mobile typecheck failure
        if: steps.mobile_typecheck.outcome == 'failure'
        run: cat mobile-typecheck.log && exit 1
      - name: Export iOS JavaScript bundle
        id: ios_export
        continue-on-error: true
        run: pnpm --filter @fitment/mobile export:ios > ios-export.log 2>&1
      - name: Preserve iOS export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-export-log
          path: ios-export.log
      - name: Report iOS export failure
        if: steps.ios_export.outcome == 'failure'
        run: cat ios-export.log && exit 1
