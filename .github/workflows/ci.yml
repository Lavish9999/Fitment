name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test:engine

  ios-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: pnpm install --frozen-lockfile=false
      - name: Typecheck mobile app
        run: pnpm --filter @fitment/mobile typecheck
      - name: Export iOS JavaScript bundle
        run: pnpm --filter @fitment/mobile export:ios
